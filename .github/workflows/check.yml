name: Agent website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: agent-site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Keep this version and digest aligned with package-lock.json's Playwright.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Read documentation through HTTP
        run: node scripts/check-agent-site.mjs --local --report output/agent-retrieval.json
      - name: Verify provisioned browser
        run: node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch(); console.log('Chromium', browser.version()); await browser.close();"
      - name: Verify real workshop behavior
        run: npm run test:browser
      - name: Verify standard analytics and visitor opt-outs
        run: |
          node test/browser/analytics.mjs
          node test/browser/analytics-standard.mjs
      - name: Verify documentation layout and search
        run: npm run test:docs:browser
      - name: Verify News filtering and article presentation
        run: node test/browser/news.mjs
      - name: Verify held release article preview
        run: node test/browser/release-article.mjs
      - name: Verify case-study images and chart
        run: node test/browser/case-studies.mjs
      - name: Verify agent setup and copy controls
        run: node test/browser/agent-setup.mjs
      - name: Verify personal app export and form boundary
        run: node test/browser/personal-preview.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agent-site-evidence
          path: output/
          if-no-files-found: ignore
