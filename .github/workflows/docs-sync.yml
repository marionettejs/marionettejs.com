name: Sync library reading copies
on:
  repository_dispatch:
    types: [library-docs-changed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-docs-sync
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Read current merged library source
        run: git clone --branch master --single-branch https://github.com/marionettejs/marionette.git "$RUNNER_TEMP/library"
      - run: npm ci
      - run: npm run docs:sync -- "$RUNNER_TEMP/library"
      - run: npm run check
      - run: node scripts/check-agent-site.mjs --local --report output/agent-retrieval.json
      - run: node scripts/docs-sync/validate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-docs-sync
          path: |
            content/docs-publication-edits.json
            output/docs-sync/validated.json
          if-no-files-found: error
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-docs-sync
      - name: Create or update the single ready PR
        env:
          DOCS_SYNC_TOKEN: ${{ secrets.DOCS_SYNC_PR_TOKEN }}
        run: node scripts/docs-sync/publish.mjs
