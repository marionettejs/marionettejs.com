name: Deployed site check
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin to check
        default: https://marionettejs.com
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: read
concurrency:
  group: deployed-site
  cancel-in-progress: false
jobs:
  verify:
    # Preview deployments carry their own origin and are noindexed; only the
    # published site can leave crawlers on an earlier beta.
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-deployment.mjs "${{ inputs.origin || 'https://marionettejs.com' }}"
